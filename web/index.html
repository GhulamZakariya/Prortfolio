    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background-color: #060d16;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 22px;
        background: #060d16;
        transition: opacity 0.5s ease;
        z-index: 9999;
      }

      #loading.hide {
        opacity: 0;
        pointer-events: none;
      }

      .brand-mark {
        width: 74px;
        height: 74px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 800;
        font-size: 26px;
        color: #1a1400;
        background: linear-gradient(135deg, #ffe566, #ffd800, #ffb300);
        box-shadow: 0 10px 40px rgba(255, 216, 0, 0.35);
        animation: pulse 1.6s ease-in-out infinite;
      }

      .brand-ring {
        position: absolute;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #ffd800;
        border-right-color: rgba(255, 216, 0, 0.2);
        animation: spin 1s linear infinite;
      }

      .loading-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #a6b1bb;
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }
    </style>
  </head>

    <div id="loading">

    <script>
      // Hide the loader once Flutter paints its first frame.
      window.addEventListener("flutter-first-frame", function () {
        var el = document.getElementById("loading");
        if (el) {
          el.classList.add("hide");
          setTimeout(function () {
            el.remove();
          }, 600);
        }
      });
    </script>
